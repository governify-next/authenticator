openapi: 3.0.0
info:
    title: Authenticator API
    version: 1.0.0
    description: |
        REST API for user identity, login, OpenID Connect and service authentication.
servers:
    - url: /

tags:
    - name: Health
      description: Server health check
    - name: Users
      description: User and authentication management
    - name: Services
      description: Service client authentication. Clients are provisioned at startup from environment variables.

paths:
    /health:
        get:
            tags:
                - Health
            summary: Health check
            responses:
                '200':
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    status:
                                        type: string

    /api/v1/users:
        get:
            tags:
                - Users
            summary: List all users
            operationId: getUsers
            security:
                - BearerAuth: []
            description: |
                Returns an array with all users in the system.
                Requires a user token with ADMIN role.
            parameters:
                - in: query
                  name: page
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                      default: 1
                  description: Page number to retrieve
                  example: 1
                - in: query
                  name: limit
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                      default: 20
                  description: Number of users per page
                  example: 20
            responses:
                '200':
                    description: A paginated list of users
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/User'
                                          pagination:
                                              $ref: '#/components/schemas/Pagination'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '500':
                    $ref: '#/components/responses/InternalError'
        post:
            tags:
                - Users
            summary: Create a new user
            operationId: createUser
            security:
                - BearerAuth: []
            description: |
                Creates a new user with the provided credentials.
                Requires a user token with ADMIN role.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UserInput'
            responses:
                '201':
                    description: User created successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/User'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '409':
                    $ref: '#/components/responses/Conflict'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/users/search:
        post:
            tags:
                - Users
            summary: Search users
            operationId: searchUsers
            security:
                - BearerAuth: []
            description: |
                Returns a paginated list of users matching the provided filters.
                Filters are combined when multiple fields are provided.
                Requires a user token with ADMIN role.
            parameters:
                - in: query
                  name: page
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                      default: 1
                  description: Page number to retrieve
                  example: 1
                - in: query
                  name: limit
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                      default: 20
                  description: Number of users per page
                  example: 20
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UserSearchFilters'
                        example:
                            usernameOrEmail: john
                            username: johndoe
                            email: john@example.com
                            systemRole: USER
                            status: ACTIVE
            responses:
                '200':
                    description: A paginated list of users matching the filters
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/User'
                                          pagination:
                                              $ref: '#/components/schemas/Pagination'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/users/me:
        get:
            tags:
                - Users
            summary: Get current user
            operationId: getCurrentUser
            security:
                - BearerAuth: []
            description: Requires a user token. Returns the authenticated user from the access token.
            responses:
                '200':
                    description: Current user found
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/User'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/users/me/password:
        put:
            tags:
                - Users
            summary: Change current user password
            operationId: changeCurrentUserPassword
            security:
                - BearerAuth: []
            description: |
                Requires a user token.
                Changes the authenticated user's password after validating the current password.
                All active refresh-token sessions are deleted after a successful password change.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ChangePasswordInput'
            responses:
                '200':
                    description: Password updated successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              nullable: true
                                              example: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/users/me/sessions:
        get:
            tags:
                - Users
            summary: List current user sessions
            operationId: getCurrentUserSessions
            security:
                - BearerAuth: []
            description: Requires a user token. Returns the active refresh-token sessions for the authenticated user.
            responses:
                '200':
                    description: Active sessions retrieved successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/UserSession'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalError'
        delete:
            tags:
                - Users
            summary: Delete all current user sessions
            operationId: deleteCurrentUserSessions
            security:
                - BearerAuth: []
            description: Requires a user token. Deletes all active refresh-token sessions for the authenticated user.
            responses:
                '200':
                    description: Sessions deleted successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              nullable: true
                                              example: null
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/users/me/sessions/{id}:
        delete:
            tags:
                - Users
            summary: Delete current user session
            operationId: deleteCurrentUserSession
            security:
                - BearerAuth: []
            description: Requires a user token. Deletes one active refresh-token session for the authenticated user.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: string
                  description: MongoDB ObjectId of the session to delete
                  example: 665c2d3e4f5a6b7c8d9e0f1a
            responses:
                '200':
                    description: Session deleted successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              nullable: true
                                              example: null
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/users/{id}/sessions:
        get:
            tags:
                - Users
            summary: List user sessions by id
            operationId: getUserSessionsById
            security:
                - BearerAuth: []
            description: |
                Returns the active refresh-token sessions for the user with the provided MongoDB ObjectId.
                Requires a user token with ADMIN role.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: string
                      pattern: '^[0-9a-fA-F]{24}$'
                  description: MongoDB ObjectId of the user
                  example: 665c2d3e4f5a6b7c8d9e0f1a
            responses:
                '200':
                    description: Active sessions retrieved successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/UserSession'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        delete:
            tags:
                - Users
            summary: Delete all user sessions by id
            operationId: deleteUserSessionsById
            security:
                - BearerAuth: []
            description: |
                Deletes all refresh-token sessions for the user with the provided MongoDB ObjectId.
                Requires a user token with ADMIN role.
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: string
                      pattern: '^[0-9a-fA-F]{24}$'
                  description: MongoDB ObjectId of the user
                  example: 665c2d3e4f5a6b7c8d9e0f1a
            responses:
                '200':
                    description: User sessions deleted successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              nullable: true
                                              example: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/users/username/{username}:
        parameters:
            - in: path
              name: username
              required: true
              schema:
                  type: string
              description: Username of the user
              example: johndoe
        get:
            tags:
                - Users
            summary: Get user by username
            operationId: getUserByUsername
            security:
                - BearerAuth: []
            description: |
                Returns a specific user by their username.
                Requires a user token with ADMIN role or a valid service token.
            responses:
                '200':
                    description: User found
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/User'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        put:
            tags:
                - Users
            summary: Update user by username
            operationId: updateUserByUsername
            security:
                - BearerAuth: []
            description: |
                Updates an existing user's information by username.
                Requires a user token with ADMIN role.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UserInput'
            responses:
                '200':
                    description: User updated successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/User'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        delete:
            tags:
                - Users
            summary: Delete user by username
            operationId: deleteUserByUsername
            security:
                - BearerAuth: []
            description: |
                Deletes a user from the system by username.
                Requires a user token with ADMIN role.
            responses:
                '200':
                    description: User deleted successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              nullable: true
                                              example: null
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/users/{id}:
        parameters:
            - in: path
              name: id
              required: true
              schema:
                  type: string
                  pattern: '^[0-9a-fA-F]{24}$'
              description: MongoDB ObjectId of the user
              example: 665c2d3e4f5a6b7c8d9e0f1a
        get:
            tags:
                - Users
            summary: Get user by id
            operationId: getUserById
            security:
                - BearerAuth: []
            description: |
                Returns a specific user by their MongoDB ObjectId.
                Requires a user token with ADMIN role or a valid service token.
            responses:
                '200':
                    description: User found
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/User'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        put:
            tags:
                - Users
            summary: Update user by id
            operationId: updateUserById
            security:
                - BearerAuth: []
            description: |
                Updates an existing user's information by MongoDB ObjectId.
                Requires a user token with ADMIN role.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UserInput'
            responses:
                '200':
                    description: User updated successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/User'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'
        delete:
            tags:
                - Users
            summary: Delete user by id
            operationId: deleteUserById
            security:
                - BearerAuth: []
            description: |
                Deletes a user from the system by MongoDB ObjectId.
                Requires a user token with ADMIN role.
            responses:
                '200':
                    description: User deleted successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              nullable: true
                                              example: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/users/login:
        post:
            tags:
                - Users
            summary: User login
            operationId: login
            description: |
                Authenticates a user using their login credentials (username or email) and password.
                Returns a short-lived JWT access token and a refresh token.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginInput'
            responses:
                '200':
                    description: Login successful. Returns an auth session.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/AuthSession'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/users/refresh:
        post:
            tags:
                - Users
            summary: Refresh auth session
            operationId: refresh
            description: |
                Rotates a valid refresh token and returns a new auth session.
                Other active refresh tokens for the same user remain valid.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RefreshTokenInput'
            responses:
                '200':
                    description: Refresh successful. Returns a new auth session.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/AuthSession'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/users/logout:
        post:
            tags:
                - Users
            summary: Logout user session
            operationId: logout
            description: Deletes the session associated with the provided refresh token.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RefreshTokenInput'
            responses:
                '200':
                    description: Session deleted successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              nullable: true
                                              example: null
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/users/oidc/login:
        post:
            tags:
                - Users
            summary: Start OIDC login
            operationId: oidcLogin
            description: |
                Builds the OIDC provider authorization URL.
                Requires OIDC to be enabled in the server configuration.
            responses:
                '200':
                    description: OIDC login URL generated successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: object
                                              properties:
                                                  loginUrl:
                                                      type: string
                                                      format: uri
                                                      description: URL where the client should redirect the user
                                                      example: https://identity.example.com/authorize?client_id=scope-manager&response_type=code
                '400':
                    $ref: '#/components/responses/ValidationError'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/users/oidc/callback:
        get:
            tags:
                - Users
            summary: Complete OIDC login
            operationId: oidcCallback
            description: |
                Handles the OIDC provider callback and returns an auth session for the associated local user.
                Requires OIDC to be enabled in the server configuration.
            parameters:
                - in: query
                  name: code
                  required: true
                  schema:
                      type: string
                  description: Authorization code returned by the OIDC provider
                - in: query
                  name: state
                  required: false
                  schema:
                      type: string
                  description: OIDC state value returned by the provider, when present
            responses:
                '200':
                    description: OIDC login completed successfully. Returns an auth session.
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/AuthSession'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/services/token:
        post:
            tags:
                - Services
            summary: Create service access token
            operationId: createServiceToken
            description: |
                Validates service client credentials and returns a short-lived JWT for service-to-service calls.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ServiceTokenInput'
            responses:
                '200':
                    description: Service token created successfully
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/ServiceToken'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/services/clients:
        get:
            tags:
                - Services
            summary: List service clients
            operationId: getServiceClients
            security:
                - BearerAuth: []
            description: |
                Returns all service clients.
                Requires a user token with ADMIN role.
            responses:
                '200':
                    description: A list of service clients
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              type: array
                                              items:
                                                  $ref: '#/components/schemas/ServiceClient'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '500':
                    $ref: '#/components/responses/InternalError'

    /api/v1/services/clients/{clientId}:
        parameters:
            - in: path
              name: clientId
              required: true
              schema:
                  type: string
              description: Service client identifier
              example: scope-manager
        get:
            tags:
                - Services
            summary: Get service client by client id
            operationId: getServiceClientByClientId
            security:
                - BearerAuth: []
            description: |
                Returns one service client by its client id.
                Requires a user token with ADMIN role.
            responses:
                '200':
                    description: Service client found
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: '#/components/schemas/SuccessResponse'
                                    - type: object
                                      properties:
                                          data:
                                              $ref: '#/components/schemas/ServiceClient'
                '401':
                    $ref: '#/components/responses/Unauthorized'
                '403':
                    $ref: '#/components/responses/Forbidden'
                '404':
                    $ref: '#/components/responses/NotFound'
                '500':
                    $ref: '#/components/responses/InternalError'

components:
    securitySchemes:
        BearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: User JWT obtained via POST /api/v1/users/login or service JWT obtained via POST /api/v1/services/token, depending on the endpoint.

    responses:
        ValidationError:
            description: Validation error
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        Unauthorized:
            description: Missing or invalid authentication token
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        Forbidden:
            description: Insufficient permissions to perform this action
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        NotFound:
            description: Resource not found
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        Conflict:
            description: Resource conflict
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
        InternalError:
            description: Internal server error
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'

    schemas:
        SuccessResponse:
            type: object
            properties:
                success:
                    type: boolean
                    example: true
                message:
                    type: string
                    example: OK
                httpStatus:
                    type: integer
                    example: 200
                appCode:
                    type: string
                    example: SUCCESS
                data:
                    nullable: true
                error:
                    type: object
                    nullable: true
                    example: null
            required:
                - success
                - message
                - httpStatus
                - appCode
                - data
                - error

        ErrorResponse:
            type: object
            properties:
                success:
                    type: boolean
                    example: false
                message:
                    type: string
                    example: Validation failed
                httpStatus:
                    type: integer
                    example: 400
                appCode:
                    type: string
                    example: VALIDATION_ERROR
                data:
                    type: object
                    nullable: true
                    example: null
                error:
                    type: object
                    nullable: true
                    properties:
                        message:
                            type: string
                        details:
                            nullable: true

        Pagination:
            type: object
            properties:
                page:
                    type: integer
                    example: 1
                limit:
                    type: integer
                    example: 20
                totalItems:
                    type: integer
                    example: 153
                totalPages:
                    type: integer
                    example: 8
                hasNextPage:
                    type: boolean
                    example: true
                hasPreviousPage:
                    type: boolean
                    example: false

        User:
            type: object
            properties:
                _id:
                    type: string
                    description: MongoDB ObjectId
                    example: 665c2d3e4f5a6b7c8d9e0f1a
                username:
                    type: string
                    example: johndoe
                email:
                    type: string
                    format: email
                    example: john@example.com
                name:
                    type: string
                    example: John
                surname:
                    type: string
                    example: Doe
                systemRole:
                    type: string
                    enum: [ADMIN, USER]
                    example: ADMIN
                status:
                    type: string
                    enum: [ACTIVE, DISABLED]
                    example: ACTIVE
                lastLoginAt:
                    type: string
                    format: date-time
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        UserInput:
            type: object
            required:
                - username
                - email
                - password
                - name
                - surname
                - systemRole
            properties:
                username:
                    type: string
                    example: johndoe
                email:
                    type: string
                    format: email
                    example: john@example.com
                password:
                    type: string
                    format: password
                    example: securePassword123
                name:
                    type: string
                    example: John
                surname:
                    type: string
                    example: Doe
                systemRole:
                    type: string
                    enum: [ADMIN, USER]
                    example: ADMIN
                status:
                    type: string
                    enum: [ACTIVE, DISABLED]
                    description: Defaults to ACTIVE when omitted
                    example: ACTIVE

        UserSearchFilters:
            type: object
            properties:
                usernameOrEmail:
                    type: string
                    description: Partial username or email match
                    example: john
                username:
                    type: string
                    description: Partial username match
                    example: johndoe
                email:
                    type: string
                    description: Partial email match
                    example: john@example.com
                systemRole:
                    type: string
                    enum: [ADMIN, USER]
                    example: USER
                status:
                    type: string
                    enum: [ACTIVE, DISABLED]
                    example: ACTIVE

        LoginInput:
            type: object
            required:
                - login
                - password
            properties:
                login:
                    type: string
                    description: Username or email
                    example: johndoe
                password:
                    type: string
                    format: password
                    example: securePassword123

        RefreshTokenInput:
            type: object
            required:
                - refreshToken
            properties:
                refreshToken:
                    type: string
                    example: YXaV2kVgE2seK9Yj4bVCx4NwS5wVwOfYp_8WQe7Ktb4

        ChangePasswordInput:
            type: object
            required:
                - currentPassword
                - newPassword
            properties:
                currentPassword:
                    type: string
                    format: password
                    example: currentPassword123
                newPassword:
                    type: string
                    format: password
                    example: newSecurePassword456

        AuthSession:
            type: object
            properties:
                token:
                    type: string
                    description: JWT access token with type=user, sub, iss, aud, exp and jti claims
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refreshToken:
                    type: string
                    description: Refresh token for one active user session
                    example: YXaV2kVgE2seK9Yj4bVCx4NwS5wVwOfYp_8WQe7Ktb4
                sessionId:
                    type: string
                    description: MongoDB ObjectId of the refresh-token session
                    example: 665c2d3e4f5a6b7c8d9e0f1a

        UserSession:
            type: object
            properties:
                _id:
                    type: string
                    description: MongoDB ObjectId of the refresh-token session
                    example: 665c2d3e4f5a6b7c8d9e0f1a
                createdAt:
                    type: string
                    format: date-time
                lastUsedAt:
                    type: string
                    format: date-time
                expiresAt:
                    type: string
                    format: date-time

        ServiceClient:
            type: object
            properties:
                _id:
                    type: string
                    description: MongoDB ObjectId
                    example: 665c2d3e4f5a6b7c8d9e0f1a
                clientId:
                    type: string
                    example: scope-manager
                lastUsedAt:
                    type: string
                    format: date-time
                    nullable: true
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time

        ServiceTokenInput:
            type: object
            required:
                - clientId
                - clientSecret
            properties:
                clientId:
                    type: string
                    example: scope-manager
                clientSecret:
                    type: string
                    format: password
                    example: scope_manager_client_secret

        ServiceToken:
            type: object
            properties:
                token:
                    type: string
                    description: JWT service token with type=service, sub, iss, aud, exp, jti and service claims
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
